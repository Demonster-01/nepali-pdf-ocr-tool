<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepali PDF OCR Tool</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>🇳🇵 Nepali PDF OCR</h1>
            <p>Convert legacy fonts to clean Unicode with GPU acceleration</p>
        </header>

        <section id="upload-section" class="card fade-in">
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span>Drag & Drop PDF or click to browse</span>
                    <input type="file" id="file-input" accept=".pdf" hidden>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="mode-select">Optimization Mode:</label>
                    <select id="mode-select">
                        <option value="fast">Fast (150 DPI)</option>
                        <option value="balanced" selected>Balanced (200 DPI)</option>
                        <option value="accurate">Accurate (300 DPI)</option>
                    </select>
                </div>
                <button id="process-btn" class="btn-primary" disabled>Start OCR</button>
            </div>
        </section>

        <section id="progress-section" class="card hidden">
            <div class="progress-header">
                <div class="status-badge" id="status-badge">Initializing...</div>
                <span id="elapsed-time">0:00</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="progress-stats">
                <span id="progress-text">Preparing pages...</span>
            </div>
            <div id="live-log" class="live-log">
                <!-- Real-time OCR snippets will appear here -->
            </div>
        </section>

        <section id="result-section" class="card hidden fade-in wide-card">
            <div class="result-header">
                <h2>✨ OCR Complete</h2>
                <div class="result-actions">
                    <a id="download-link" href="#" class="btn-primary btn-download">Download PDF</a>
                    <button id="reset-btn" class="btn-outline">New Upload</button>
                </div>
            </div>

            <div class="viewer-container">
                <div class="viewer-panel">
                    <div class="panel-header">
                        <h3>Original PDF</h3>
                        <span class="badge">Legacy Font</span>
                    </div>
                    <div class="viewer-frame">
                        <iframe id="original-viewer"></iframe>
                    </div>
                </div>
                <div class="viewer-panel highlight">
                    <div class="panel-header">
                        <h3>Processed PDF</h3>
                        <span class="badge success">Searchable Unicode</span>
                    </div>
                    <div class="viewer-frame">
                        <iframe id="processed-viewer"></iframe>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
